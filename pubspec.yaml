name: sjmobile
description: "SINAU APP — aplikasi mobile pembelajaran Bahasa & Budaya Jawa."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  dio: ^5.7.0
  provider: ^6.1.2
  google_fonts: ^6.2.1
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  audioplayers: ^6.1.0
  record: ^7.1.1
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  intl: ^0.19.0
  material_symbols_icons: ^4.2801.0
  google_sign_in: ^7.2.0
  home_widget: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

# path_provider_android 2.3.x menarik modul native `jni` yang butuh NDK/CMake.
# Versi 2.2.x memakai method channel sehingga build tidak memerlukan NDK.
dependency_overrides:
  path_provider_android: 2.2.23

flutter:
  uses-material-design: true
  assets:
    - asset/logo/
