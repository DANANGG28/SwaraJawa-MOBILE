name: Release APK

on:
  push:
    branches: [ chore/ci-cd-apk ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Versi rilis tanpa awalan v (mis. 1.0.1). Kosongkan untuk memakai versi pubspec.yaml.'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.47.6
  JAVA_VERSION: '17'
  # Build rilis wajib menembak backend produksi.
  SJ_BASE_URL: https://sinau-app.my.id/api
  SJ_GOOGLE_SERVER_CLIENT_ID: 915311225235-hkpo6fcudhk8gq6dqg4dtd7lb51amr03.apps.googleusercontent.com

jobs:
  release-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # `android/app/build.gradle.kts` memakai ndkVersion 28.2.13676358.
      # Runner GitHub sudah menyediakan Android SDK; android-actions/setup-android
      # tidak dipakai karena menginstal paket `tools` yang sudah dihapus.
      - name: Install Android NDK
        run: |
          set -euo pipefail
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ -d "${ANDROID_HOME}/ndk/28.2.13676358" ]; then
            echo "NDK 28.2.13676358 sudah tersedia."
            exit 0
          fi
          SDKMANAGER="$(ls -d "${ANDROID_HOME}"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "${SDKMANAGER}" --install "ndk;28.2.13676358"
          test -d "${ANDROID_HOME}/ndk/28.2.13676358"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="$(sed -nE 's/^version: *([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml)"
          fi
          if [ -z "${VERSION}" ]; then
            echo "::error::Versi rilis tidak bisa ditentukan."
            exit 1
          fi
          echo "name=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Rilis versi ${VERSION} (build ${{ github.run_number }})"

      - name: Configure release signing
        if: env.KEYSTORE_BASE64 != ''
        run: |
          set -euo pipefail
          echo "${KEYSTORE_BASE64}" | base64 -d > android/app/release.jks
          cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF

      - name: Warn about missing signing secrets
        if: env.KEYSTORE_BASE64 == ''
        run: |
          echo "::warning::Secrets ANDROID_KEYSTORE_BASE64 dkk. belum diisi — APK rilis akan ditandatangani debug keystore dan tidak bisa dipakai untuk update aplikasi terpasang."

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: |
          flutter build apk --release \
            --build-name="${{ steps.version.outputs.name }}" \
            --build-number="${{ github.run_number }}" \
            --dart-define=SJ_BASE_URL="${SJ_BASE_URL}" \
            --dart-define=SJ_GOOGLE_SERVER_CLIENT_ID="${SJ_GOOGLE_SERVER_CLIENT_ID}"

      - name: Verify APK targets production
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -f "${APK}"
          echo "APK: $(du -h "${APK}" | cut -f1)"
          if ! unzip -p "${APK}" 'lib/*/libapp.so' | grep -aqF 'sinau-app.my.id'; then
            echo "::error::APK tidak memuat host API produksi (${SJ_BASE_URL})."
            exit 1
          fi

      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             "build/app/outputs/flutter-apk/sinau-app-${{ steps.version.outputs.name }}-${{ github.run_number }}.apk"
          ls -l build/app/outputs/flutter-apk/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sinau-app-apk-${{ steps.version.outputs.name }}-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: SINAU APP ${{ steps.version.outputs.name }}
          files: build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true
